server {
    listen       PORT_PLACEHOLDER;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # SPA fallback — every path serves index.html so the React router handles it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed assets (Vite fingerprints filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html (always fetch fresh)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Healthcheck endpoint for Railway
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
        access_log off;
    }
}
